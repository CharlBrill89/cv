# Builds charl-brill-resume.pdf from resume.html and deploys the site to GitHub Pages.
# Requires Settings → Pages → Source set to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build résumé PDF
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=10000 \
            --print-to-pdf="$PWD/charl-brill-resume.pdf" \
            http://localhost:8000/resume.html
          test -s charl-brill-resume.pdf
          ls -la charl-brill-resume.pdf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
